[package]
name = "carl_pubky_bridge"
version = "0.1.0"
edition = "2021"

[lib]
name = "carl_pubky_bridge"
crate-type = ["staticlib"]

[dependencies]
pubky = "0.6.0-rc.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
once_cell = "1"
tokio = { version = "1", features = ["rt-multi-thread"] }
hex = "0.4"